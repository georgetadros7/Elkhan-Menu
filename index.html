<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>كافيه الخان 👑 ملوك الروقان 😎😎</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      font-family: Arial, Tahoma, sans-serif;

      background: linear-gradient(135deg, #111111, #292929);

      color: #ffffff;

      min-height: 100vh;

    }

    .container {

      width: 100%;

      max-width: 650px;

      margin: auto;

      padding: 45px 20px;

      text-align: center;

    }

    .title {

      font-size: 29px;

      font-weight: bold;

      margin-bottom: 30px;

      line-height: 1.5;

    }

    .card {

      background: #1c1c1c;

      border: 1px solid #444;

      border-radius: 22px;

      padding: 25px;

      margin-bottom: 20px;

      box-shadow: 0 10px 30px rgba(0,0,0,0.25);

    }

    .menu-box {

      min-height: 260px;

      border: 2px dashed #777;

      border-radius: 18px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      padding: 25px;

    }

    .menu-box h2 {

      margin: 0 0 15px;

      font-size: 25px;

    }

    .menu-box p {

      color: #bbbbbb;

      font-size: 16px;

      line-height: 1.7;

    }

    .social-link {

      display: block;

      width: 100%;

      padding: 16px;

      margin: 12px 0;

      background: #333333;

      color: #ffffff;

      text-decoration: none;

      border-radius: 14px;

      font-size: 17px;

      font-weight: bold;

      transition: 0.2s;

    }

    .social-link:hover {

      background: #444444;

      transform: translateY(-2px);

    }

    .footer {

      color: #888888;

      font-size: 13px;

      margin-top: 25px;

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- اسم الكافيه -->

    <div class="title">

      كافيه الخان 👑 ملوك الروقان 😎😎

    </div>

    <!-- المنيو -->

    <div class="card">

      <div class="menu-box">

        <h2>📋 المنيو</h2>

        <p>

          المنيو هتكون هنا قريبًا

        </p>

      </div>

    </div>

    <!-- روابط السوشيال -->

    <div class="card">

      <a

        class="social-link"

        href="https://www.facebook.com/share/1Mk5KXX9J6/"

        target="_blank"

        rel="noopener noreferrer">

        📘 فيسبوك

      </a>

      <a

        class="social-link"

        href="https://www.tiktok.com/@elkhan_cafe77"

        target="_blank"

        rel="noopener noreferrer">

        🎵 تيك توك

      </a>

    </div>

    <div class="footer">

      كافيه الخان 👑 ملوك الروقان 😎😎

    </div>

  </div>

</body>

</html>
